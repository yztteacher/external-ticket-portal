<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工单提交系统</title>
  <meta name="description" content="提交售后问题或需求，我们会尽快处理。">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="submit-page">
  <main class="site-shell" id="formView">
    <div class="form-wrap">
      <header class="page-heading"><div class="brand-mark">工</div><div><h1>工单提交系统</h1><p>请填写以下信息提交工单，我们会尽快处理</p></div></header>
      <section class="panel">
        <div class="panel-header"><h2>工单信息</h2><p>请详细描述您遇到的问题或需求</p></div>
        <form id="ticketForm" class="ticket-form">
          <label><span>工单标题 <b>*</b></span><input id="title" placeholder="请输入工单标题" required></label>
          <label><span>问题描述 <b>*</b></span><textarea id="description" placeholder="请详细描述您遇到的问题或需求" rows="6" required></textarea></label>
          <div class="field-grid">
            <label><span>您的姓名 <b>*</b></span><input id="name" placeholder="请输入您的姓名" required></label>
            <label><span>联系电话</span><input id="phone" placeholder="请输入联系电话"></label>
            <label><span>电子邮箱</span><input id="email" type="email" placeholder="请输入电子邮箱"></label>
            <label><span>优先级</span><select id="priority"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label>
          </div>
          <p class="form-error" id="error" hidden></p>
          <div class="button-row"><button class="button primary" id="submitButton">提交工单</button><a class="button secondary" href="admin.html">管理后台</a></div>
        </form>
      </section>
      <p class="privacy-note">您提交的信息仅用于处理本次工单。</p>
    </div>
  </main>
  <main class="site-shell center-shell" id="successView" hidden>
    <section class="success-card"><div class="success-mark">✓</div><h1>提交成功！</h1><p>您的工单已成功提交，我们会尽快处理。</p><div class="button-row"><button class="button primary" id="againButton">继续提交</button><a class="button secondary" href="admin.html">管理后台</a></div></section>
  </main>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
