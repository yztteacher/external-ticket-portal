<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工单提交系统</title>
  <meta name="description" content="提交售后问题或需求，我们会尽快处理。">
  <link rel="stylesheet" href="styles.css">
  <script src="supabase-lite.js"></script>
</head>
<body class="submit-page">
  <main class="site-shell center-shell" id="loginView">
    <section class="login-card">
      <div class="brand-mark login-mark">工</div>
      <h1>工单提交系统</h1>
      <p>请输入账号和密码后继续</p>
      <form id="loginForm" class="login-form">
        <label><span>账号</span><input id="loginUsername" autocomplete="username" placeholder="请输入账号" required></label>
        <label><span>密码</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
        <label class="remember-row"><input id="rememberPassword" type="checkbox" checked><span>记住密码</span></label>
        <p class="form-error" id="loginError" hidden></p>
        <button class="button primary login-button" id="loginButton">登录</button>
      </form>
    </section>
  </main>
  <main class="site-shell" id="formView" hidden>
    <div class="form-wrap">
      <header class="page-heading">
        <div class="brand-mark">工</div>
        <div class="heading-copy"><h1>工单提交系统</h1><p>请填写以下信息提交工单，我们会尽快处理</p></div>
        <button class="button secondary logout-button" id="logoutButton" type="button">退出登录</button>
      </header>
      <section class="panel">
        <div class="panel-header"><h2>工单信息</h2><p>请详细描述您遇到的问题或需求</p></div>
        <form id="ticketForm" class="ticket-form">
          <label><span>工单标题 <b>*</b></span><input id="title" placeholder="请输入工单标题" required></label>
          <label><span>问题描述 <b>*</b></span><textarea id="description" placeholder="请详细描述您遇到的问题或需求" rows="6" required></textarea></label>
          <div class="field-grid">
            <label><span>您的姓名 <b>*</b></span><input id="name" placeholder="请输入您的姓名" required></label>
            <label><span>联系电话</span><input id="phone" placeholder="请输入联系电话"></label>
            <label><span>电子邮箱</span><input id="email" type="email" placeholder="请输入电子邮箱"></label>
            <label><span>优先级</span><select id="priority"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label>
          </div>
          <p class="form-error" id="error" hidden></p>
          <div class="button-row"><button class="button primary" id="submitButton">提交工单</button></div>
        </form>
      </section>
      <p class="privacy-note">您提交的信息仅用于处理本次工单。</p>
    </div>
  </main>
  <main class="site-shell center-shell" id="successView" hidden>
    <section class="success-card"><div class="success-mark">✓</div><h1>提交成功！</h1><p>您的工单已成功提交，我们会尽快处理。</p><div class="button-row"><button class="button primary" id="againButton">继续提交</button><button class="button secondary" id="successLogoutButton">退出登录</button></div></section>
  </main>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
